<!DOCTYPE html>

    <head>
        <meta charset="UTF-8">
        <title>PIXEL</title>
        <style>
            header{
                font-size: 43px;
                font-weight: bold;
                font-family:"abordage";
                /* vertical-align: middle;
                text-align: center; */
                /* border-bottom: 2px solid rgb(0, 0, 0); */
                top: 0; 
                left: 0;
                position:fixed;
                width: 100%;
                height: 80px;
                background-color: white;

                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-content: space-between;
              
                 z-index: 9999;
            }
            .name{
                padding-top: 20px;
            }
            .line{
                width: calc(96% - 12px);
                border-bottom: 2px solid rgb(0, 0, 0);
                /* margin-bottom: 0; */
                /* flex:1 */
    
            }
         
          
            .outer{
                width: 96%;
                display: flex;
                justify-items: auto;
                gap:12px 6px;
                margin:16px auto;
                
                
                flex-wrap: wrap;}
         
            .date{
                font-size:1.2vw;
                /* vertical-align: middle; */
                font-family:"abordage";
                margin: auto;
              
            }
            img{
                object-fit: contain;
                width:100%;
            }
            .card{
                aspect-ratio: 8/10;

                border-radius:3px; 
                box-shadow: 0px 0px 3px rgb(80, 80, 80);
                /* 隐藏图片上边圆角 */
                overflow: hidden;
                transition: 0.1s linear all;
             
                /* flex-grow: 1;
                flex-shrink: 1; */
                /* 每行放五个 */
                flex-basis: calc(20% - 4.8px);

                display: flex;
                flex-direction: column;
                /* flex-wrap: wrap; */
                /* 保证图片贴住上边，因为默认是strech而图片没给高度会居中 */
                align-items: flex-start;
                /* 让日期文字垂直不留空，方便居中 */
                align-content: flex-start;
                /* 让hover里的向上移动生效 */
                position: relative;
            }
            .card:hover{
                box-shadow: 0px 0px 4px rgb(53, 53, 53);
                cursor: pointer;
                top: -0.5px;
            }
            /* @media (max-width:992px) {
                .card{
                    flex-basis: calc(33% - 2.2px);
                }
            } */
             @media (max-width:900px) {
                .card{
                    flex-basis: calc(50% - 3px);
                }
                .date {
                    font-size: 2.4vw;
                }
            }


        </style>
    </head>

      <script>
    // 获取所有卡片
    const cards = document.querySelectorAll('.card');
    
    cards.forEach(card => {
        // 找到卡片内的 img 和 date 元素
        const img = card.querySelector('img');
        const dateDiv = card.querySelector('.date');
        
        if (img && dateDiv) {
            // 从 src 中提取文件名（去掉路径和扩展名）
            const src = img.getAttribute('src');
            const fileName = src.match(/([^\/]+)(?=\.\w+$)/)[0]; // 匹配最后一个斜杠和扩展名之间的内容

            // 更新日期文本
            dateDiv.textContent = fileName.replace(/_/g, '.'); // 可选：将下划线替换为点
        }
    });
