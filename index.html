        <style>
            @font-face {
                font-family: 'abordage';
                src: url('./fonts/Abordage-Regular.woff2') format('woff2'),
                     url('./fonts/Abordage-Regular.woff') format('woff'),
                     url('./fonts/Abordage-Regular.otf') format('otf');
                font-weight: normal;
                font-style: normal;
}
            header{
                font-size: 43px;
                font-weight: bold;
                font-family:"abordage";
                /* vertical-align: middle;
                text-align: center; */
                /* border-bottom: 2px solid rgb(0, 0, 0); */
                top: 0; 
                left: 0;
                position:fixed;
                width: 100%;
                height: 80px;
                background-color: white;

                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-content: space-between;
              
                 z-index: 1;
            }
            header::after {
                 content: "";
                    position: absolute;
                    bottom: 0;
                    /* left: 2%; */
                    width: calc(96% - 12px);
                    border-bottom: 2px solid black;
                }
            .name{
                padding-top: 20px;
            }
         
            .outer{
                width: 96%;
                display: flex;
                justify-items: auto;
                gap:12px 6px;
                margin:16px auto;
                 flex-wrap: wrap;}

            .blur{
                filter: blur(6px);
                pointer-events: none; /* 禁止交互 */
                transition: filter 0.3s;
                transition-timing-function:ease-out;
                z-index: 1;
            }
         
            .date{
                /* font-size:1.2vw; */
                /* vertical-align: middle; */
                font-family:"abordage";
                margin: auto;
              
            }
            img{
                object-fit: contain;
                width:100%;
            }
            .card{
                aspect-ratio: 8/10;
                background-color: white;

                border-radius:3px; 
                box-shadow: 0px 0px 3px rgb(80, 80, 80);
                /* 隐藏图片上边圆角 */
                overflow: hidden;
                transition: 0.1s linear all;
             
                /* flex-grow: 1;
                flex-shrink: 1; */
                /* 每行放五个 */
                flex-basis: calc(20% - 4.8px);

                display: flex;
                flex-direction: column;
                /* flex-wrap: wrap; */
                /* 保证图片贴住上边，因为默认是strech而图片没给高度会居中 */
                align-items: flex-start;
                /* 让日期文字垂直不留空，方便居中 */
                align-content: flex-start;
                /* 让hover里的向上移动生效 */
                position: relative;
                font-size:1.2vw;
                color: black;
            }
            .card:hover{
                box-shadow: 0px 0px 4px rgb(53, 53, 53);
                cursor: pointer;
                /* top: -0.5px; */
            }
           
             .space{height: 80px;}
             @media (max-width:900px) {
                .card{
                    flex-basis: calc(50% - 3px);
                }
                .date {font-size: 3.2vw; }
                .name{padding-top: 5px; }
                header{height: 60px;}
                .space{height: 60px;}
            }
            .selected{
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                    width: 85vw;          /* 优先宽度 70% */
                    max-height: 90vh;     /* 最大高度不超过 90% 屏幕 */
                    height: auto;         /* 高度自适应 */

                    max-width: calc(90vh * 0.7); /* 限制宽度在高不够时自适应缩小 */
                 flex-basis: calc(60% - 4.8px);
                z-index: 2;
                border-radius: 10px;
                font-size:30px;

            }
            .selected img.grid-overlay {
                position: absolute;
                /* top: 0; */
                /* left: 0; */
                width: 100%;  /* 和父容器一样大 */
                /* height: 100%; */
                pointer-events: none;  /* 让点击穿透，不影响交互 */
                user-select: none;     /* 防止选中 */
                /* image-rendering: pixelated;  */
                z-index: 10;  /* 保证在原图上方 */
            }
            
         
            /* 只隐藏滚动条，不禁用滚动 */
            .no-scrollbar {
                overflow:auto;
                -ms-overflow-style: none;  /* IE 和 Edge */
                scrollbar-width: none;     /* Firefox */
            }

            .no-scrollbar::-webkit-scrollbar {
                display: none;             /* Chrome, Safari */
            }
               .no-scroll {
                overflow: hidden; */

            }

      <script>
        const cards = document.querySelectorAll('.card');
        const outer = document.querySelector('.outer');
        const header = document.querySelector('header');

        let selectedCard = null;

        cards.forEach(card => {
            const img = card.querySelector('img');
            const dateDiv = card.querySelector('.date');

            if (img && dateDiv) {
                const src = img.getAttribute('src');
                const fileName = src.match(/([^\/]+)(?=\.\w+$)/)[0];
                dateDiv.textContent = fileName.replace(/_/g, '.');
            }

            card.onclick = function (e) {
                e.stopPropagation();

                // 如果已有选中的卡片，先清除
                if (selectedCard) {
                    // selectedCard.remove();
                    outer.classList.remove('blur');
                    header.classList.remove('blur');
                    document.body.classList.remove('no-scroll');
                    document.documentElement.classList.remove('no-scroll');
                    document.body.classList.remove('no-scroll');
                    selectedCard = null;
                    return;
                }

                // 克隆当前卡片
                const clone = card.cloneNode(true);
                clone.classList.add('selected');
                     // 创建一个新的图片元素
                    const img = document.createElement('img');
                    img.src = './draws/g2.PNG';  // 替换成你想插入的图片地址
                    // img.alt = 'description';         // 可选，图片描述
                    img.classList.add('grid-overlay');
                    // 把图片插入到clone的第一个子元素位置
                    clone.insertBefore(img, clone.firstChild);

                // 点击克隆卡片关闭
                clone.onclick = function (e) {
                    e.stopPropagation();
                    clone.remove();
                    outer.classList.remove('blur');
                    header.classList.remove('blur');
                    document.body.classList.remove('no-scroll');
                    document.documentElement.classList.remove('no-scroll');
                    document.body.classList.remove('no-scroll');
                    selectedCard = null;
                };

                document.body.appendChild(clone);
                outer.classList.add('blur');
                header.classList.add('blur');
                document.body.classList.add('no-scroll');
                document.documentElement.classList.add('no-scroll');
                document.body.classList.add('no-scroll');
                selectedCard = clone;
                  // 设置初始样式（透明、缩小）
                clone.style.opacity = '0';
                clone.style.transition = 'opacity 0.2s ease, transform 0.2s ease-out';

                // 下一帧再触发过渡到目标样式（完全显示、正常大小）
                requestAnimationFrame(() => {
                    clone.style.opacity = '1';
                });

                
            };
        });

        // 点击空白区域关闭选中
        document.body.onclick = () => {
            if (selectedCard) {
                selectedCard.remove();
                outer.classList.remove('blur');
                header.classList.remove('blur');
                document.body.classList.remove('no-scroll');
                document.documentElement.classList.remove('no-scroll');
                document.body.classList.remove('no-scroll');
                selectedCard = null;
            }
        };
